name: Deploy do GitHub Pages

on:
  push:
    branches:
      - claude/fishing-challenge-platform-nyamib
      - main

# Pozwolenie na zapis do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tylko jeden deploy na raz
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Studio
          # Hasło do podglądu — zmień na swoje
          NEXT_PUBLIC_PREVIEW_PASS: ${{ secrets.PREVIEW_PASS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
